# Continuous integration: build and sanity-check on every push / PR.
# Deploy (CD) is separate: either extend this workflow with OIDC + terraform apply,
# or use a hosted path (e.g. Cloudflare Pages — see package.json "deploy").
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  blastocyst-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blastocyst_ml/requirements.txt
      - run: pip install -r blastocyst_ml/requirements.txt
      - name: Import check (FastAPI app loads)
        working-directory: blastocyst_ml
        run: python -c "import serve_predict; print('serve_predict OK')"
